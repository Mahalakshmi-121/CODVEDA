<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List App | Thatha Mahalakshmi</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
body { background:#0f172a; color:white; min-height:100vh; padding:20px; }
.container { max-width:600px; margin:40px auto; background:#1e293b; padding:30px; border-radius:15px; }
h1 { text-align:center; color:#facc15; margin-bottom:5px; }
p { text-align:center; color:#cbd5e1; margin-bottom:25px; }
.input-row { display:flex; gap:10px; margin-bottom:20px; }
.input-row input { flex:1; padding:13px; border-radius:8px; border:none; font-size:16px; }
.input-row button { background:#facc15; border:none; padding:13px 20px; border-radius:8px; font-weight:bold; cursor:pointer; }
.filters { display:flex; gap:10px; justify-content:center; margin-bottom:20px; }
.filters button { padding:8px 15px; border-radius:20px; border:1px solid #475569; background:#0f172a; color:white; cursor:pointer; }
.filters button.active { background:#facc15; color:black; border-color:#facc15; font-weight:bold; }
ul { list-style:none; }
li { background:white; color:black; padding:13px 15px; border-radius:8px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
li.done span { text-decoration:line-through; color:#94a3b8; }
li span { cursor:pointer; flex:1; }
.delete { background:#ef4444; color:white; border:none; padding:7px 12px; border-radius:6px; cursor:pointer; margin-left:10px; }
#count { text-align:center; color:#94a3b8; margin-top:15px; }
.back { display:block; text-align:center; margin-top:20px; color:#facc15; text-decoration:none; }
</style>
</head>
<body>

<div class="container">
<h1>✅ My To-Do List</h1>
<p>Thatha Mahalakshmi | Codveda Level 2 - Task 1</p>

<div class="input-row">
<input type="text" id="taskInput" placeholder="Enter your task... e.g. Learn JavaScript">
<button onclick="addTask()">Add +</button>
</div>

<div class="filters">
<button onclick="filterTasks('all', this)" class="active">All</button>
<button onclick="filterTasks('pending', this)">Pending</button>
<button onclick="filterTasks('done', this)">Completed</button>
<button onclick="clearAll()" style="background:#ef4444; color:white; border-color:#ef4444;">Clear All</button>
</div>

<ul id="taskList"></ul>
<p id="count">No tasks yet. Add your first task!</p>
<a href="#" class="back">← Back to Portfolio</a>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("myTasks")) || [];
let currentFilter = "all";

function saveTasks() {
  localStorage.setItem("myTasks", JSON.stringify(tasks));
}

function renderTasks() {
  let list = document.getElementById("taskList");
  list.innerHTML = "";
  let filtered = tasks.filter(t => {
    if (currentFilter == "pending") return !t.done;
    if (currentFilter == "done") return t.done;
    return true;
  });
  filtered.forEach((task, index) => {
    let realIndex = tasks.indexOf(task);
    let li = document.createElement("li");
    if (task.done) li.classList.add("done");
    li.innerHTML = `<span onclick="toggleDone(${realIndex})">${task.done ? "✅ " : "⬜ "} ${task.text}</span><button class="delete" onclick="deleteTask(${realIndex})">Delete</button>`;
    list.appendChild(li);
  });
  let doneCount = tasks.filter(t => t.done).length;
  document.getElementById("count").innerText = `Total: ${tasks.length} | Completed: ${doneCount} | Pending: ${tasks.length - doneCount}`;
}

function addTask() {
  let input = document.getElementById("taskInput");
  let text = input.value.trim();
  if (text == "") { alert("Please enter a task!"); return; }
  tasks.push({ text: text, done: false });
  saveTasks(); renderTasks();
  input.value = "";
}

function toggleDone(index) {
  tasks[index].done = !tasks[index].done;
  saveTasks(); renderTasks();
}

function deleteTask(index) {
  tasks.splice(index, 1);
  saveTasks(); renderTasks();
}

function filterTasks(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderTasks();
}

function clearAll() {
  if (confirm("Delete all tasks?")) { tasks = []; saveTasks(); renderTasks(); }
}

document.getElementById("taskInput").addEventListener("keypress", function(e){
  if(e.key === "Enter") addTask();
});

renderTasks();
</script>

</body>
</html>
